<!--
WakeMyPc - page theme (CSS + header). Included once from the CBI model.

Colors use rgba() on the neutral scale, so the page follows both the light and
the dark LuCI theme without extra rules.
-->
<div class="wmp-hero">
	<div class="wmp-hero-icon">🖥</div>
	<div>
		<div class="wmp-hero-title">WakeMyPc</div>
		<div class="wmp-hero-sub">Wake-on-LAN и SSH: включение, выключение и перезагрузка ПК из Telegram</div>
	</div>
</div>

<style>
.cbi-map {
	--wmp-accent: #229ed9;
	--wmp-ok: #16a34a;
	--wmp-warn: #d97706;
	--wmp-bad: #dc2626;
	--wmp-card: rgba(127,127,127,.07);
	--wmp-card-2: rgba(127,127,127,.04);
	--wmp-border: rgba(127,127,127,.22);
	--wmp-muted: rgba(127,127,127,.85);
	--wmp-radius: 14px;
}

/* Заголовок ---------------------------------------------------------- */
.wmp-hero {
	display: flex; align-items: center; gap: 14px;
	padding: 16px 18px; margin: 0 0 16px;
	border-radius: var(--wmp-radius);
	background: linear-gradient(135deg, rgba(34,158,217,.16), rgba(34,158,217,.03));
	border: 1px solid var(--wmp-border);
}
.wmp-hero-icon {
	width: 46px; height: 46px; border-radius: 13px; flex: 0 0 auto;
	display: flex; align-items: center; justify-content: center; font-size: 22px;
	background: var(--wmp-accent); color: #fff;
	box-shadow: 0 6px 16px rgba(34,158,217,.35);
}
.wmp-hero-title { font-size: 19px; font-weight: 700; letter-spacing: .2px; }
.wmp-hero-sub { font-size: 12.5px; color: var(--wmp-muted); margin-top: 2px; }

/* Секции как карточки ------------------------------------------------- */
.cbi-map .cbi-section {
	background: var(--wmp-card);
	border: 1px solid var(--wmp-border);
	border-radius: var(--wmp-radius);
	padding: 14px 16px;
	margin: 0 0 14px;
	box-shadow: none;
}
.cbi-map .cbi-section > h3 {
	font-size: 15px; font-weight: 700; margin: 0 0 12px; padding: 0 0 10px;
	border-bottom: 1px solid var(--wmp-border);
}
.cbi-map .cbi-section-descr { color: var(--wmp-muted); font-size: 12.5px; margin: -4px 0 10px; }
.cbi-map .cbi-value { padding: 6px 0; }
.cbi-map .cbi-value-title { font-weight: 600; }
.cbi-map .cbi-value-description { color: var(--wmp-muted); font-size: 12px; }

/* Поля и кнопки -------------------------------------------------------- */
.cbi-map .cbi-input-text,
.cbi-map .cbi-input-select,
.cbi-map .cbi-input-password,
.cbi-map textarea {
	border-radius: 9px !important;
	border: 1px solid var(--wmp-border) !important;
	padding: 7px 10px !important;
	background: var(--wmp-card-2) !important;
	color: inherit !important;
	box-shadow: none !important;
}
.cbi-map textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.cbi-map .cbi-button {
	border-radius: 9px !important;
	padding: 7px 14px !important;
	font-weight: 600;
	border: 1px solid var(--wmp-border) !important;
	box-shadow: none !important;
}
.cbi-map .cbi-button-apply,
.cbi-map .cbi-button-action { background: var(--wmp-accent) !important; border-color: var(--wmp-accent) !important; color: #fff !important; }
.cbi-map .cbi-button-reset { background: var(--wmp-card) !important; }
.cbi-map .cbi-button-remove { background: var(--wmp-bad) !important; border-color: var(--wmp-bad) !important; color: #fff !important; }

/* Плитки статуса ------------------------------------------------------- */
.wmp-tiles {
	display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
	gap: 12px; margin-bottom: 12px;
}
.wmp-tile {
	padding: 14px 16px; border-radius: 13px;
	background: var(--wmp-card-2); border: 1px solid var(--wmp-border);
}
.wmp-tile-label {
	font-size: 11px; font-weight: 700; letter-spacing: .08em;
	text-transform: uppercase; color: var(--wmp-muted); margin-bottom: 8px;
}
.wmp-tile-value { font-size: 16px; font-weight: 650; line-height: 1.3; }
.wmp-tile-sub { font-size: 12px; color: var(--wmp-muted); margin-top: 4px; word-break: break-all; }

.wmp-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.wmp-actions .cbi-button { min-width: 120px; }
.wmp-muted { color: var(--wmp-muted); margin-left: 8px; }

/* Код Worker'а --------------------------------------------------------- */
#wmp-worker-code {
	width: 100%; height: 340px; resize: vertical;
	line-height: 1.35; white-space: pre; overflow: auto;
}
.wmp-steps { margin: 0 0 10px; padding-left: 22px; }
.wmp-steps li { margin: 3px 0; }

/* Плотнее на телефоне -------------------------------------------------- */
@media (max-width: 700px) {
	.wmp-hero { padding: 12px 14px; }
	.wmp-hero-title { font-size: 17px; }
	.cbi-map .cbi-value-title { float: none; width: auto; text-align: left; }
	.cbi-map .cbi-value-field { margin-left: 0; }
}
</style>
